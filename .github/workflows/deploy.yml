name: Deploy

# main → production (the beta). Pull requests → the shared preview deployment.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare (${{ github.event_name == 'push' && 'production' || 'preview' }})
    # Forks don't get secrets; skip them.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      WRANGLER_SEND_METRICS: "false"
      TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys (see CONTRIBUTING.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.secrets.outputs.ready == 'true'

      - name: Build web app
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm build
        env:
          # The GPS lab and other dev tools are only included in preview builds.
          VITE_DEV_TOOLS: ${{ env.TARGET == 'preview' && 'true' || 'false' }}

      - name: Deploy worker
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        working-directory: apps/worker
        run: |
          if [ "$TARGET" = "production" ]; then ENV_FLAG="--env="; DB_NAME="runhach-db"; else ENV_FLAG="--env preview"; DB_NAME="runhach-db-preview"; fi

          # Create the D1 database on the first deploy.
          if ! pnpm exec wrangler d1 list --json \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>process.exit(JSON.parse(d).some(x=>x.name===process.argv[1])?0:1))' "$DB_NAME"; then
            pnpm exec wrangler d1 create "$DB_NAME"
          fi

          pnpm exec wrangler d1 migrations apply DB --remote $ENV_FLAG

          VARS=(--var "BUILD_VERSION:${GITHUB_SHA::7}")
          if [ -n "$EMAIL_FROM" ]; then VARS+=(--var "EMAIL_FROM:$EMAIL_FROM"); fi
          pnpm exec wrangler deploy $ENV_FLAG "${VARS[@]}" | tee deploy.log

          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY $ENV_FLAG
          fi

          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Deployed to $TARGET: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- runhach-preview -->";
            const body = `${marker}\n**Preview deployed:** ${process.env.URL}\n\nBuild \`${context.sha.slice(0, 7)}\` · includes dev tools (GPS lab at \`/dev/gps\`) · separate preview database.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
